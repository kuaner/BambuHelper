; Waveshare ESP32-P4-WIFI6-Touch-LCD-7B: 32 MB flash / 32 MB PSRAM,
; EK79007 1024x600 MIPI-DSI, GT911, ESP32-C6 ESP-Hosted over SDIO.
; Arduino 3.3.11 matches the vendor examples. Keep older boards on core 2.x.
; Default: production P4 rev3.1+. Use the _rev1 env only for pre-v3 silicon.
[p4_7b_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-p4_r3
framework = arduino
; Explicit pins also restore the right core after building a legacy 2.x env.
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
    framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11-libs.tar.xz
monitor_speed = 115200
upload_speed = 460800
board_build.f_cpu = 360000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = partitions_32mb.csv
board_build.embed_files =
    assets/p4/p4_sans_24.vlw
    assets/p4/p4_sans_20.vlw
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
lib_deps =
    lovyan03/LovyanGFX@1.2.24
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
build_flags =
    -D BOARD_NAME=\"Waveshare_ESP32-P4-WIFI6-Touch-LCD-7B\"
    -D BOARD_PANEL=\"EK79007_1024x600_GT911\"
    -D BOARD_IS_WS_P4_7B=1
    -D BOARD_HAS_PSRAM=1
    ; This compact dashboard has one or two printer connections; no legacy
    ; four-cloud-TLS model or camera/thumbnail workers are enabled.
    -D MAX_ACTIVE_PRINTERS=2
    ; Use the board's USB-Serial/JTAG port for logs and Improv provisioning.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D DISPLAY_1024x600=1
    -D BACKLIGHT_PIN=32
    -D USE_GT911=1
    -D GT911_SDA=7
    -D GT911_SCL=8
    -D GT911_INT=-1
    ; ES8311 speaker output, shared I2C bus with GT911 (no microphone capture).
    -D BOARD_HAS_ES8311_AUDIO=1
    -D AUDIO_I2C_ADDR=0x18
    -D AUDIO_I2C_SDA=7
    -D AUDIO_I2C_SCL=8
    -D AUDIO_I2S_PORT=0
    -D AUDIO_I2S_MCLK=13
    -D AUDIO_I2S_BCLK=12
    -D AUDIO_I2S_LRC=10
    -D AUDIO_I2S_DOUT=9
    -D AUDIO_PA_CTRL=53

[env:ws_p4_lcd_7b]
extends = p4_7b_common
build_flags =
    ${p4_7b_common.build_flags}
    -D BOARD_VARIANT=\"ws_p4_lcd_7b\"

[env:ws_p4_lcd_7b_rev1]
extends = p4_7b_common
board = esp32-p4
build_flags =
    ${p4_7b_common.build_flags}
    -D BOARD_VARIANT=\"ws_p4_lcd_7b_rev1\"

; Compile the experimental standalone TUTK transport without enabling periodic
; downloads. Account authentication and a real snapshot must be verified first.
[env:ws_p4_lcd_7b_rev1_camera]
extends = env:ws_p4_lcd_7b_rev1
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    ${env:ws_p4_lcd_7b_rev1.build_flags}
    -D P4_CLOUD_CAMERA_EXPERIMENTAL=1
    ; The connected CH343 port is UART0; keep experimental diagnostics here.
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -Wl,--undefined=p4_cloud_camera_link_check
